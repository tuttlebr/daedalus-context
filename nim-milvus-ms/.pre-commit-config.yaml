# https://pre-commit.com/
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-yaml
        exclude: '^milvus-deploy/templates/'
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: bash-syntax
        name: bash syntax
        entry: bash -n deploy.sh destroy.sh reset-etcd.sh validate.sh
        language: system
        pass_filenames: false
        files: '.*\.sh$'
