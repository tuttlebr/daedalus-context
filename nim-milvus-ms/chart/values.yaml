# milvus contains the values passed to the pinned upstream Milvus dependency.
milvus:
  image:
    all:
      repository: milvusdb/milvus
      tag: v2.6.11
      pullPolicy: IfNotPresent

  milvusAuthEnv: &milvusAuthEnv
    - name: COMMON_SECURITY_AUTHORIZATIONENABLED
      value: "true"
    - name: COMMON_SECURITY_DEFAULTROOTPASSWORD
      valueFrom:
        secretKeyRef:
          name: milvus-root-credentials
          key: password
    - name: COMMON_SECURITY_ROOTSHOULDBINDROLE
      value: "false"
    - name: COMMON_SECURITY_ENABLEPUBLICPRIVILEGE
      value: "false"
    - name: MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: milvus-minio-credentials
          key: accesskey
    - name: MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: milvus-minio-credentials
          key: secretkey

  extraConfigFiles:
    user.yaml: |+
      common:
        security:
          authorizationEnabled: true
          rootShouldBindRole: false
          enablePublicPrivilege: false

  streaming:
    enabled: true
  pulsarv3:
    enabled: false
  woodpecker:
    enabled: true
  serviceAccount:
    create: true
    name: milvus
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  topologySpreadConstraints: []
  # Milvus v2.6.11 publishes amd64 and arm64 images. Tolerate the reservation
  # taint on the GB10 worker while leaving amd64-only workloads protected.
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  service:
    type: ClusterIP
    port: 19530
    nodePort: ""
    loadBalancerSourceRanges: []

  proxy:
    replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: milvus
            component: proxy
    extraEnv: *milvusAuthEnv
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 2Gi}
  queryNode:
    replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: milvus
            component: querynode
    extraEnv: *milvusAuthEnv
    resources:
      requests: {cpu: 250m, memory: 32Gi}
      limits: {cpu: "4", memory: 64Gi}
  dataNode:
    replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: milvus
            component: datanode
    extraEnv: *milvusAuthEnv
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "4", memory: 12Gi}
  indexNode:
    enabled: false
  streamingNode:
    replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: milvus
            component: streamingnode
    extraEnv: *milvusAuthEnv
    resources:
      requests: {cpu: 100m, memory: 8Gi}
      limits: {cpu: "2", memory: 16Gi}
  mixCoordinator:
    replicas: 2
    activeStandby:
      enabled: true
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: milvus
            component: mixcoord
    extraEnv: *milvusAuthEnv
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "2", memory: 4Gi}

  minio:
    enabled: true
    existingSecret: milvus-minio-credentials
    image: &minioImage
      # Mirror of the exact amd64 manifest recovered from healthy cluster nodes.
      # Upstream historical tags are unavailable; the digest preserves binary identity.
      repository: daedalus.ddns.me:5050/btuttle/minio
      tag: RELEASE.2024-12-18T13-15-44Z-amd64@sha256:34c8e2f52a5984492555427fee07254c80036bdb7079bb91679232abd7a4fa20
      pullPolicy: IfNotPresent
    # The server image also ships /usr/bin/mc. Reuse its pinned mirror for the
    # bucket hook; the dependency's historical minio/mc image is unavailable.
    mcImage: *minioImage
    # Distributed MinIO members require identical server binaries. Mixed
    # amd64 and arm64 members have different checksums and cannot share a pool.
    accessKey: ""
    secretKey: ""
    bucketName: milvus-bucket
    buckets:
      - {name: milvus-bucket, policy: none, purge: false}
      - {name: nv-ingest, policy: none, purge: false}
    tls:
      enabled: false
    service:
      type: ClusterIP
      port: 9000
    replicas: 4
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [daedalus-06]
    persistence:
      storageClass: nfs-client
      accessMode: ReadWriteOnce
      size: 100Gi
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    securityContext:
      enabled: true
      runAsUser: 977
      runAsGroup: 988
      fsGroup: 988
    resources:
      requests: {cpu: 250m, memory: 1024Mi}
      limits: {cpu: "2", memory: 4Gi}

  etcd:
    podAntiAffinityPreset: hard
    pdb:
      create: true
      minAvailable: ""
      maxUnavailable: 1
    serviceAccount:
      create: true
      name: milvus-etcd
    persistence:
      storageClass: local-etcd
      accessMode: ReadWriteOnce
      size: 10Gi
    resources:
      requests: {cpu: 150m, memory: 512Mi}
      limits: {cpu: "2", memory: 4Gi}

# podDisruptionBudgets configures Daedalus-owned budgets missing upstream.
podDisruptionBudgets:
  proxy: {minAvailable: 2, tier: online}
  querynode: {minAvailable: 2, tier: online}
  datanode: {minAvailable: 2, tier: online}
  streamingnode: {minAvailable: 2, tier: ingestion}
  mixcoord: {minAvailable: 1, tier: online}
