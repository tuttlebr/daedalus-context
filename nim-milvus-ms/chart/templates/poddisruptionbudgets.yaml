{{- range $component, $budget := .Values.podDisruptionBudgets }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-milvus-%s" $.Release.Name $component | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "daedalus-milvus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    daedalus.ai/tier: {{ $budget.tier }}
spec:
  minAvailable: {{ $budget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
      app.kubernetes.io/instance: {{ $.Release.Name }}
      component: {{ $component }}
{{- end }}
