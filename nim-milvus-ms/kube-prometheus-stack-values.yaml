# Preserve the current metrics volume while making scheduling independent of hostnames.
# The native Prometheus stays at zero replicas; the active instance and existing Service
# are managed through the chart-supported extraManifests value.
prometheus:
  service:
    enabled: false
  prometheusSpec:
    nodeSelector: null
    replicas: 0
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
extraManifests:
- apiVersion: monitoring.coreos.com/v1
  kind: Prometheus
  metadata:
    name: kube-prometheus-maintenance
    namespace: monitoring
    labels:
      app.kubernetes.io/part-of: kube-prometheus-stack
      maintenance.daedalus.io/replaces: kube-prometheus-stack-prometheus
      app.kubernetes.io/managed-by: Helm
    annotations:
      maintenance.daedalus.io/reason: Permanent Prometheus instance, managed by kube-prometheus-stack
        Helm; existing metrics volume preserved.
  spec:
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - prometheus
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - kube-prometheus-maintenance
            topologyKey: kubernetes.io/hostname
          weight: 100
    alerting:
      alertmanagers:
      - apiVersion: v2
        name: kube-prometheus-stack-alertmanager
        namespace: monitoring
        pathPrefix: /
        port: http-web
    automountServiceAccountToken: true
    enableAdminAPI: false
    enableOTLPReceiver: false
    evaluationInterval: 30s
    externalUrl: http://kube-prometheus-stack-prometheus.monitoring:9090
    hostNetwork: false
    image: quay.io/prometheus/prometheus:v3.11.0
    imagePullPolicy: IfNotPresent
    listenLocal: false
    logFormat: logfmt
    logLevel: info
    paused: false
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    portName: http-web
    probeNamespaceSelector: {}
    probeSelector:
      matchLabels:
        release: kube-prometheus-stack
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 2048Mi
    retention: 30d
    routePrefix: /
    ruleNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    scrapeConfigNamespaceSelector: {}
    scrapeConfigSelector:
      matchLabels:
        release: kube-prometheus-stack
    scrapeInterval: 30s
    securityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: kube-prometheus-stack-prometheus
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    shards: 1
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: local-fast
    tsdb:
      outOfOrderTimeWindow: 0s
    version: v3.11.0
    walCompression: true
- apiVersion: v1
  kind: Service
  metadata:
    name: kube-prometheus-stack-prometheus
    namespace: monitoring
    labels:
      app: kube-prometheus-stack-prometheus
      self-monitor: 'true'
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: kube-prometheus-stack
      app.kubernetes.io/version: 82.18.0
      app.kubernetes.io/part-of: kube-prometheus-stack
      chart: kube-prometheus-stack-82.18.0
      release: kube-prometheus-stack
      heritage: Helm
  spec:
    externalTrafficPolicy: Cluster
    ports:
    - name: http-web
      nodePort: 30500
      port: 9090
      targetPort: 9090
    - name: reloader-web
      appProtocol: http
      port: 8080
      targetPort: reloader-web
      nodePort: 32190
    publishNotReadyAddresses: false
    selector:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-maintenance
    sessionAffinity: None
    type: NodePort
