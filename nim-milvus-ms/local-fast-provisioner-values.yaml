# General-purpose node-local storage for latency-sensitive state.
#
# This class is intentionally non-default, node-affine, and Retain. Rancher
# local-path-provisioner does not enforce requested PVC capacity, so large
# bulk/object data must remain on a capacity-managed storage class.

replicaCount: 1

storageClass:
  create: true
  defaultClass: false
  defaultVolumeType: local
  name: local-fast
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  allowedTopologies:
    - matchLabelExpressions:
        - key: kubernetes.io/hostname
          values:
            - daedalus-02
            - daedalus-03
            - daedalus-01
            - daedalus-06

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths: []
  - node: daedalus-02
    paths:
      - /var/lib/daedalus-local-path/fast
  - node: daedalus-03
    paths:
      - /var/lib/daedalus-local-path/fast
  - node: daedalus-01
    paths:
      - /var/lib/daedalus-local-path/fast
  - node: daedalus-06
    paths:
      - /var/lib/daedalus-local-path/fast

configmap:
  name: local-fast-path-config
  setup: |-
    #!/bin/sh
    set -eu
    base_dir="${VOL_DIR%/*}"
    if [ ! -f "${base_dir}/.local-fast-ready" ]; then
      echo "Refusing local-fast provisioning without ${base_dir}/.local-fast-ready" >&2
      exit 1
    fi
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    base_dir="${VOL_DIR%/*}"
    if [ ! -f "${base_dir}/.local-fast-ready" ]; then
      echo "Refusing local-fast teardown without ${base_dir}/.local-fast-ready" >&2
      exit 1
    fi
    case "$VOL_DIR" in
      "${base_dir}"/pvc-*) rm -rf -- "$VOL_DIR" ;;
      *) echo "Refusing unexpected local-fast teardown path: $VOL_DIR" >&2; exit 1 ;;
    esac
  helperPod:
    name: local-fast-helper-pod
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

helperImage:
  repository: docker.io/library/busybox
  tag: "1.36.1"

priorityClassName: system-cluster-critical

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsUser: 65534
  runAsGroup: 65534

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

helperPod:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
