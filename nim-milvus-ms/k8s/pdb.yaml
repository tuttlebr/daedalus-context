apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: __RELEASE_NAME__-milvus-proxy
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/instance: __RELEASE_NAME__
    app.kubernetes.io/version: "2.6.11"
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: online
    daedalus.ai/capability: vector-store
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
      app.kubernetes.io/instance: __RELEASE_NAME__
      component: proxy
