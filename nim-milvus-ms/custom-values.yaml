image:
  all:
    repository: milvusdb/milvus
    tag: v2.6.11
    pullPolicy: IfNotPresent

milvusAuthEnv: &milvusAuthEnv
  - name: COMMON_SECURITY_AUTHORIZATIONENABLED
    value: "true"
  - name: COMMON_SECURITY_DEFAULTROOTPASSWORD
    valueFrom:
      secretKeyRef:
        name: milvus-root-credentials
        key: password
  - name: COMMON_SECURITY_ROOTSHOULDBINDROLE
    # Keep the built-in root account on Milvus's superuser path. Setting this
    # to true makes root depend on persisted RBAC role membership; upgraded
    # metadata without the admin binding can otherwise lock root out.
    value: "false"
  - name: COMMON_SECURITY_ENABLEPUBLICPRIVILEGE
    value: "false"
  # The upstream chart otherwise writes its minio.accessKey/minio.secretKey
  # values into the Milvus ConfigMap. Keep those values empty below and source
  # the credentials directly from the same Secret used by the MinIO pods.
  - name: MINIO_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: milvus-minio-credentials
        key: accesskey
  - name: MINIO_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: milvus-minio-credentials
        key: secretkey

extraConfigFiles:
  user.yaml: |+
    common:
      security:
        authorizationEnabled: true
        rootShouldBindRole: false
        enablePublicPrivilege: false

streaming:
  enabled: true

pulsarv3:
  enabled: false

woodpecker:
  enabled: true

serviceAccount:
  create: true
  name: milvus

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

topologySpreadConstraints: []

# Keep Milvus application pods off the heterogeneous ARM64 worker. The
# upstream image starts on that node, but streaming nodes can fail closed while
# the dependency cluster is reconciling. MinIO and etcd retain their own
# placement policies and existing PVC topology.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - daedalus-06

service:
  type: ClusterIP
  port: 19530
  nodePort: ""
  loadBalancerSourceRanges: []

proxy:
  replicas: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: milvus
          component: proxy
  extraEnv: *milvusAuthEnv
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

queryNode:
  replicas: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: milvus
          component: querynode
  extraEnv: *milvusAuthEnv
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 12Gi

dataNode:
  replicas: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: milvus
          component: datanode
  extraEnv: *milvusAuthEnv
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 12Gi

indexNode:
  enabled: false

streamingNode:
  replicas: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: milvus
          component: streamingnode
  extraEnv: *milvusAuthEnv
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi

mixCoordinator:
  replicas: 2
  activeStandby:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: milvus
          component: mixcoord
  extraEnv: *milvusAuthEnv
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

minio:
  enabled: true
  existingSecret: milvus-minio-credentials
  # Distributed MinIO members verify that every peer runs the same binary.
  # Mixed AMD64 and ARM64 members have different binary checksums and cannot
  # form one server pool, so keep this release off the heterogeneous worker.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - daedalus-06
  # Never put object-store credentials in Helm values or the rendered Milvus
  # ConfigMap. Milvus receives them through the Secret-backed environment above.
  accessKey: ""
  secretKey: ""
  bucketName: milvus-bucket
  # The chart's idempotent post-install/post-upgrade hook creates both the
  # Milvus segment bucket and the document bucket consumed by NV-Ingest and
  # daedalus-agent.
  buckets:
    - name: milvus-bucket
      policy: none
      purge: false
    - name: nv-ingest
      policy: none
      purge: false
  tls:
    enabled: false
  service:
    type: ClusterIP
    port: 9000
  # Distributed MinIO requires at least four server instances.
  replicas: 4
  persistence:
    # Keep bulk objects off the etcd-local class. The deploy wrapper requires
    # an explicit reviewed class; this direct-Helm fallback does not itself
    # claim the backing NFS endpoint is highly available.
    storageClass: nfs-client
    accessMode: ReadWriteOnce
    size: 100Gi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  securityContext:
    enabled: true
    runAsUser: 977
    runAsGroup: 988
    fsGroup: 988
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

etcd:
  # Node-local etcd members must occupy distinct failure domains. A preferred
  # rule is insufficient because the dynamic local provisioner can create
  # multiple independent directories on the same node.
  podAntiAffinityPreset: hard
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: 1
  serviceAccount:
    create: true
    name: milvus-etcd
  persistence:
    # etcd metadata is latency-sensitive and small. Keep bulk Milvus/MinIO data
    # on NFS, but explicitly place etcd on the dedicated local NVMe class.
    storageClass: local-etcd
    accessMode: ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
