apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unifi-mcp.fullname" . }}
  labels:
    {{- include "unifi-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "unifi-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unifi-mcp.labels" . | nindent 8 }}
      annotations:
        checksum/controller: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "unifi-mcp.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "unifi-mcp.selectorLabels" . | nindent 14 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: unifi-network-mcp-server
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          env:
            - {name: SERVER_MODE, value: streamable-http}
            - {name: SERVER_PORT, value: "8080"}
            - {name: MCP_REQUIRE_AUTH, value: "true"}
            - name: MCP_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.tokenKey }}}}
            - name: MCP_AUTH_TOKEN_NEXT
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.nextTokenKey }}, optional: true}}
            - {name: UNIFI_FIXED_CONTROLLER, value: "true"}
            - name: UNIFI_BASE_URL
              valueFrom: {configMapKeyRef: {name: {{ include "unifi-mcp.fullname" . }}-defaults, key: base-url}}
            - name: UNIFI_INSECURE_SKIP_VERIFY
              valueFrom: {configMapKeyRef: {name: {{ include "unifi-mcp.fullname" . }}-defaults, key: insecure-skip-verify}}
            - name: UNIFI_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.controller.existingSecret }}, key: {{ .Values.controller.apiKeyKey }}}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 10, periodSeconds: 30, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
