nameOverride: ""
fullnameOverride: url-ingest

images:
  crawler: daedalus.ddns.me:5050/btuttle/url-ingest:0.1.0
  runner: daedalus.ddns.me:5050/btuttle/url-ingest-runner:2.0.5
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: nvcr-imagepullsecret

serviceAccount:
  create: true
  name: ""

persistence:
  data:
    storageClass: nfs-client
    accessModes: [ReadWriteMany]
    size: 50Gi
    keep: true
  manifests:
    storageClass: nfs-client
    accessModes: [ReadWriteMany]
    size: 1Gi
    keep: true
  pdfClaimName: pdf-server-data

endpoints:
  embedding: http://nemotron-retriever-embedder.daedalus.svc.cluster.local:8000/v1
  nvIngestHost: nv-ingest
  nvIngestPort: 7670
  milvusUri: http://milvus:19530
  minioEndpoint: milvus-minio:9000
  minioBucket: nv-ingest

auth:
  huggingFace:
    existingSecret: url-ingest-hf
    tokenKey: HF_ACCESS_TOKEN
  milvus:
    username: root
    existingSecret: milvus-root-credentials
    passwordKey: password
  minio:
    existingSecret: milvus-minio-credentials
    accessKey: accesskey
    secretKey: secretkey

schedules:
  suspend: true
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 82800
  backoffLimit: 3
  ttlSecondsAfterFinished: 2592000
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

ingestion:
  # Shared manifest-PVC semaphore capacity. Keep scheduled jobs serialized by
  # default; root manual runs override this to their bounded shard parallelism.
  globalCapacity: 1

urlLists:
  kubernetes: ""
  vetpartner: ""

collections:
  nvidia:
    schedule: "0 2 * * *"
    includePdfs: true
    fileChunkSize: 32
    urlFileChunkSize: 32
    # External extraction NIMs are shared and may throttle large PDFs. Keep
    # PDF submissions small without reducing URL-ingestion concurrency.
    pdfFileChunkSize: 2
    clientBatchSize: 16
    clientConcurrencyLimit: 16
    workSize: 30Gi
    resources:
      requests: {memory: 3072Mi, cpu: 375m, ephemeral-storage: 10Gi}
      limits: {memory: 16Gi, cpu: "8", ephemeral-storage: 30Gi}
    crawlers:
      - name: nvidiadocs
        file: nvidiadocs_url_links.txt
        inputType: sitemap
        maxAgeDays: 365
        tryMarkdown: true
      - name: nvidia
        file: nvidia_url_links.txt
        inputType: sitemap
        maxAgeDays: 365
  kubernetes:
    schedule: "0 3 * * *"
    includePdfs: true
    fileChunkSize: 64
    urlFileChunkSize: 64
    pdfFileChunkSize: 2
    clientBatchSize: 16
    clientConcurrencyLimit: 16
    workSize: 10Gi
    resources:
      requests: {memory: 1024Mi, cpu: 500m, ephemeral-storage: 2Gi}
      limits: {memory: 4Gi, cpu: "2", ephemeral-storage: 10Gi}
    crawlers:
      - name: kubernetes
        file: k8s_url_links.txt
        inputType: url
  vetpartner:
    schedule: "0 4 * * *"
    includePdfs: true
    fileChunkSize: 64
    urlFileChunkSize: 64
    pdfFileChunkSize: 2
    clientBatchSize: 16
    clientConcurrencyLimit: 16
    workSize: 10Gi
    resources:
      requests: {memory: 1024Mi, cpu: 575m, ephemeral-storage: 2Gi}
      limits: {memory: 4Gi, cpu: "2", ephemeral-storage: 10Gi}
    crawlers:
      - name: vetpartner
        file: vetpartner_url_links.txt
        inputType: url
  semianalysis:
    schedule: "0 5 * * *"
    includePdfs: true
    fileChunkSize: 64
    urlFileChunkSize: 64
    pdfFileChunkSize: 2
    clientBatchSize: 16
    clientConcurrencyLimit: 16
    workSize: 15Gi
    resources:
      requests: {memory: 1024Mi, cpu: 250m, ephemeral-storage: 4Gi}
      limits: {memory: 4Gi, cpu: "2", ephemeral-storage: 15Gi}
    crawlers:
      - name: semianalysis
        file: semianalysis_url_links.txt
        inputType: sitemap
        maxAgeDays: 365
  mentalhealth:
    schedule: "0 6 * * *"
    includePdfs: true
    fileChunkSize: 8
    urlFileChunkSize: 64
    pdfFileChunkSize: 2
    clientBatchSize: 8
    clientConcurrencyLimit: 8
    workSize: 10Gi
    resources:
      requests: {memory: 1024Mi, cpu: 250m, ephemeral-storage: 2Gi}
      limits: {memory: 4Gi, cpu: "2", ephemeral-storage: 10Gi}
    crawlers: []

nodeSelector: {}
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [daedalus-06]
tolerations: []

monitoring:
  enabled: false
  labels:
    release: kube-prometheus-stack
