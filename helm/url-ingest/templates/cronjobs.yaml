{{- if lt (int .Values.ingestion.globalCapacity) 1 }}
{{- fail "ingestion.globalCapacity must be at least 1" }}
{{- end }}
{{- range $collectionName, $collection := .Values.collections }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "url-ingest.fullname" $ }}-{{ $collectionName }}
  labels:
    {{- include "url-ingest.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $collectionName }}
spec:
  suspend: {{ $.Values.schedules.suspend }}
  schedule: {{ $collection.schedule | quote }}
  startingDeadlineSeconds: {{ $.Values.schedules.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $.Values.schedules.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.schedules.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $.Values.schedules.activeDeadlineSeconds }}
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ $.Values.schedules.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "url-ingest.labels" $ | nindent 12 }}
            app.kubernetes.io/component: {{ $collectionName }}
        spec:
          serviceAccountName: {{ include "url-ingest.serviceAccountName" $ }}
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $collection.crawlers }}
          initContainers:
            {{- range . }}
            - name: crawl-{{ .name }}
              image: {{ $.Values.images.crawler | quote }}
              imagePullPolicy: {{ $.Values.images.pullPolicy }}
              command: [url_ingest]
              args:
                - --input
                - /files/{{ .file }}
                - --output
                - /downloaded_urls/{{ $collectionName }}
                - --input-type
                - {{ .inputType | quote }}
                {{- with .maxAgeDays }}
                - --max-age-days
                - {{ . | quote }}
                {{- end }}
                {{- if .tryMarkdown }}
                - --try-markdown
                {{- end }}
                - --skip-existing
                - --allow-failures
                - --delay-ms
                - "100"
              env:
                - {name: RAYON_NUM_THREADS, value: "2"}
              volumeMounts:
                - {name: url-data, mountPath: /downloaded_urls}
                - {name: url-lists, mountPath: /files, readOnly: true}
              resources:
                requests: {memory: 256Mi, cpu: 500m}
                limits: {memory: 512Mi, cpu: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
            {{- end }}
          {{- end }}
          containers:
            - name: nv-ingest
              image: {{ $.Values.images.runner | quote }}
              imagePullPolicy: {{ $.Values.images.pullPolicy }}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  capacity="${GLOBAL_INGEST_CAPACITY:-1}"
                  case "${capacity}" in
                    ''|*[!0-9]*|0) echo "GLOBAL_INGEST_CAPACITY must be a positive integer" >&2; exit 64 ;;
                  esac
                  slot=""
                  index=0
                  while [ "${index}" -lt "${capacity}" ]; do
                    candidate="/manifests/global-ingest-capacity-${index}.lock"
                    if mkdir "${candidate}" 2>/dev/null; then
                      slot="${candidate}"
                      break
                    fi
                    index=$((index + 1))
                  done
                  [ -n "${slot}" ] || { echo "All ${capacity} global ingestion capacity slots are in use" >&2; exit 75; }
                  lock="${slot}"
                  trap 'rmdir "${lock}" 2>/dev/null || true' EXIT INT TERM
                  /opt/nv_ingest_runtime/bin/python3 /opt/daedalus/nv-ingest-ms-tasks.py
              env:
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: GLOBAL_INGEST_CAPACITY, value: {{ $.Values.ingestion.globalCapacity | quote }}}
                - {name: INGEST_MODE, value: single}
                - {name: SINGLE_COLLECTION, value: {{ $collectionName | quote }}}
                - {name: INCLUDE_PDFS, value: {{ $collection.includePdfs | quote }}}
                - {name: URL_BASE_PATH, value: /workspace/urls}
                - {name: PDF_BASE_PATH, value: /workspace/pdf-server}
                - {name: MANIFEST_BASE_PATH, value: /manifests}
                - {name: CHUNK_SIZE, value: "1024"}
                - {name: CHUNK_OVERLAP, value: "64"}
                - {name: EMBEDDING_DENSE_DIM, value: "2048"}
                - {name: TOKENIZER, value: meta-llama/Llama-3.2-1B}
                - {name: NV_INGEST_MESSAGE_HOST, value: {{ $.Values.endpoints.nvIngestHost | quote }}}
                - {name: NV_INGEST_MESSAGE_PORT, value: {{ $.Values.endpoints.nvIngestPort | quote }}}
                - {name: MILVUS_URI, value: {{ $.Values.endpoints.milvusUri | quote }}}
                - {name: MILVUS_USERNAME, value: {{ $.Values.auth.milvus.username | quote }}}
                - name: MILVUS_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: {{ $.Values.auth.milvus.existingSecret }}, key: {{ $.Values.auth.milvus.passwordKey }}}
                - {name: MINIO_ENDPOINT, value: {{ $.Values.endpoints.minioEndpoint | quote }}}
                - {name: MINIO_BUCKET, value: {{ $.Values.endpoints.minioBucket | quote }}}
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: {{ $.Values.auth.minio.existingSecret }}, key: {{ $.Values.auth.minio.accessKey }}}
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef: {name: {{ $.Values.auth.minio.existingSecret }}, key: {{ $.Values.auth.minio.secretKey }}}
                - name: HF_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef: {name: {{ $.Values.auth.huggingFace.existingSecret }}, key: {{ $.Values.auth.huggingFace.tokenKey }}}
                - {name: FILE_CHUNK_SIZE, value: {{ $collection.fileChunkSize | quote }}}
                - {name: URL_FILE_CHUNK_SIZE, value: {{ $collection.urlFileChunkSize | quote }}}
                - {name: PDF_FILE_CHUNK_SIZE, value: {{ $collection.pdfFileChunkSize | quote }}}
                - {name: CLIENT_BATCH_SIZE, value: {{ $collection.clientBatchSize | quote }}}
                - {name: CLIENT_CONCURRENCY_LIMIT, value: {{ $collection.clientConcurrencyLimit | quote }}}
                - {name: SAVE_RESULTS_TO_DISK, value: "true"}
                - {name: RESULTS_BASE_PATH, value: /tmp/nv-ingest/results}
                - {name: NEVER_DROP_COLLECTIONS, value: "true"}
                - {name: INGEST_LOG_LEVEL, value: INFO}
                - {name: INGEST_VERSION, value: v1}
                - name: INGEST_RUN_ID
                  valueFrom: {fieldRef: {fieldPath: metadata.name}}
                - {name: STATUS_REPORT_PATH, value: /manifests/status/{{ $collectionName }}-status.json}
                - {name: FAILURES_REPORT_PATH, value: /manifests/failures/{{ $collectionName }}-failures.json}
              volumeMounts:
                - {name: url-data, mountPath: /workspace/urls, readOnly: true}
                - {name: pdf-data, mountPath: /workspace/pdf-server, readOnly: true}
                - {name: manifests, mountPath: /manifests}
                - {name: ingest-work, mountPath: /tmp/nv-ingest}
              resources:
                {{- toYaml $collection.resources | nindent 16 }}
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          volumes:
            - name: url-data
              persistentVolumeClaim: {claimName: {{ include "url-ingest.fullname" $ }}-data}
            - name: pdf-data
              persistentVolumeClaim: {claimName: {{ $.Values.persistence.pdfClaimName }}}
            - name: manifests
              persistentVolumeClaim: {claimName: {{ include "url-ingest.fullname" $ }}-manifests}
            {{- with $collection.crawlers }}
            - name: url-lists
              configMap:
                name: {{ include "url-ingest.fullname" $ }}-{{ if eq $collectionName "kubernetes" }}k8s-urls{{ else if eq $collectionName "vetpartner" }}vetpartner-urls{{ else }}url-lists{{ end }}
            {{- end }}
            - name: ingest-work
              emptyDir: {sizeLimit: {{ $collection.workSize }}}
---
{{- end }}
