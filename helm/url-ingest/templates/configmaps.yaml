    https://blogs.nvidia.com/sitemap_index.xml
    https://developer.nvidia.com/sitemap_index.xml
    https://nvidianews.nvidia.com/sitemap.xml
  semianalysis_url_links.txt: |
    https://semianalysis.com/wp-sitemap-posts-post-1.xml
    https://semianalysis.com/wp-sitemap-posts-page-1.xml
    https://semianalysis.com/wp-sitemap-taxonomies-category-1.xml
    https://semianalysis.com/wp-sitemap-taxonomies-post_tag-1.xml
    https://semianalysis.com/wp-sitemap-taxonomies-core-research-tags-1.xml
    https://semianalysis.com/wp-sitemap-users-1.xml
