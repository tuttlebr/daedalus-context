apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-ingest.fullname" . }}-url-lists
  labels:
    {{- include "url-ingest.labels" . | nindent 4 }}
data:
  nvidiadocs_url_links.txt: |
    https://docs.nvidia.com/bsp-sitemap.xml
    https://docs.nvidia.com/cumulus-networking-ethernet-software-sitemap.xml
    https://docs.nvidia.com/bsp_sitemap_index.xml
    https://docs.nvidia.com/s3-sitemap-index.xml
