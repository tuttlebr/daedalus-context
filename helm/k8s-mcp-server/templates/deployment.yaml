apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-mcp.fullname" . }}
  labels:
    {{- include "k8s-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "k8s-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-mcp.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-mcp.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "k8s-mcp.selectorLabels" . | nindent 14 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: k8s-mcp-server
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          env:
            - {name: SERVER_MODE, value: streamable-http}
            - {name: SERVER_PORT, value: "8080"}
            - {name: SERVER_READ_ONLY, value: "true"}
            - {name: SERVER_NO_HELM, value: "true"}
            - {name: MCP_REQUIRE_AUTH, value: "true"}
            - name: MCP_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.tokenKey }}}}
            - name: MCP_AUTH_TOKEN_NEXT
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.nextTokenKey }}, optional: true}}
            - name: OPENCODE_BASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.agent.existingSecret }}, key: {{ .Values.agent.baseUrlKey }}, optional: true}}
            - name: OPENCODE_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.agent.existingSecret }}, key: {{ .Values.agent.apiKeyKey }}, optional: true}}
            - name: OPENCODE_MODEL
              valueFrom: {secretKeyRef: {name: {{ .Values.agent.existingSecret }}, key: {{ .Values.agent.modelKey }}, optional: true}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: helm-cache, mountPath: /home/appuser/.cache/helm}
            - {name: helm-config, mountPath: /home/appuser/.config/helm}
            - {name: opencode-data, mountPath: /home/appuser/.local/share/opencode}
            - {name: opencode-cache, mountPath: /home/appuser/.cache/opencode}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 10, periodSeconds: 30, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: helm-cache, emptyDir: {}}
        - {name: helm-config, emptyDir: {}}
        - {name: opencode-data, emptyDir: {}}
        - {name: opencode-cache, emptyDir: {}}
