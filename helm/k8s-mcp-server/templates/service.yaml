apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-mcp.fullname" . }}
  labels:
    {{- include "k8s-mcp.labels" . | nindent 4 }}
  {{- if .Values.service.external.enabled }}
  annotations:
    service.cilium.io/src-ranges-policy: allow
  {{- end }}
spec:
  type: {{ ternary "LoadBalancer" "ClusterIP" .Values.service.external.enabled }}
  {{- if .Values.service.external.enabled }}
  loadBalancerClass: {{ .Values.service.external.loadBalancerClass }}
  allocateLoadBalancerNodePorts: true
  {{- with .Values.service.external.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  sessionAffinity: ClientIP
  sessionAffinityConfig: {clientIP: {timeoutSeconds: 3600}}
  {{- end }}
  selector:
    {{- include "k8s-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if .Values.service.external.enabled }}
      nodePort: {{ .Values.service.external.nodePort }}
      {{- end }}
