# Production values for the shared Daedalus namespace. The Agent consumes both
# endpoints through same-namespace ClusterIP Services.
networkPolicy:
  ciliumNodePort:
    enabled: false
  ingressCIDRs: {embedder: [], reranker: []}

embedder:
  service:
    type: ClusterIP
    port: 8000
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

reranker:
  service:
    type: ClusterIP
    port: 8000
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
