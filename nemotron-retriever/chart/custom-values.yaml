# Fixed NodePorts for LAN clients; see README.md for model-host node selection.
networkPolicy:
  ciliumNodePort:
    enabled: true
  ingressCIDRs:
    embedder:
      - 192.168.1.0/24
    reranker:
      - 192.168.1.0/24

embedder:
  service:
    type: NodePort
    port: 8000
    externalTrafficPolicy: Cluster
    nodePort: 30085

reranker:
  service:
    type: NodePort
    port: 8000
    externalTrafficPolicy: Cluster
    nodePort: 30086
