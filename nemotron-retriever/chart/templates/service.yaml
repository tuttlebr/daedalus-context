{{- range $component := list "reranker" "embedder" }}
{{- $server := index $.Values $component }}
{{- if $server.enabled }}
{{- include "nemotron-retriever.validateServiceExposure" (dict "root" $ "server" $server "component" $component) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemotron-retriever.componentName" (dict "root" $ "component" $component) }}
  namespace: {{ include "nemotron-retriever.namespace" $ }}
  labels:
    {{- include "nemotron-retriever.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $server.service.type }}
  {{- if or (eq $server.service.type "NodePort") (eq $server.service.type "LoadBalancer") }}
  externalTrafficPolicy: {{ $server.service.externalTrafficPolicy }}
  {{- end }}
  {{- with $server.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  {{- if eq $server.service.type "LoadBalancer" }}
  {{- with $server.service.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  allocateLoadBalancerNodePorts: {{ $server.service.allocateLoadBalancerNodePorts }}
  {{- with $server.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ $server.service.port }}
      targetPort: {{ ternary "api" "vllm-http" $.Values.nimCompatibility.enabled }}
      protocol: TCP
      appProtocol: http
      {{- if and (or (eq $server.service.type "NodePort") (eq $server.service.type "LoadBalancer")) $server.service.nodePort }}
      nodePort: {{ $server.service.nodePort }}
      {{- end }}
  selector:
    {{- include "nemotron-retriever.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
{{- end }}
{{- end }}
