{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nemotron-retriever.serviceAccountName" . }}
  namespace: {{ include "nemotron-retriever.namespace" . }}
  labels:
    {{- include "nemotron-retriever.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-serving
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
