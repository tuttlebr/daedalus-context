# Leave empty to use the Helm release namespace. Set only for compatibility
# with an existing release whose resources intentionally live elsewhere.
namespaceOverride: ""

nameOverride: ""
fullnameOverride: ""

image:
  repository: vllm/vllm-openai
  # The multimodal embedder requires vLLM 0.17.0 or newer.
  tag: v0.17.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

# The models are currently public. Set existingSecret only when a Hugging Face
# token is required by your environment or by a pinned/private model revision.
huggingFace:
  existingSecret: ""
  tokenKey: token
  cacheMountPath: /data/huggingface

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Daedalus and NV-Ingest currently use NVIDIA NIM request/response shapes.
# This sidecar preserves those APIs while also proxying native vLLM requests.
nimCompatibility:
  enabled: true
  port: 8080
  image:
    repository: python
    tag: 3.12.11-alpine3.22
    pullPolicy: IfNotPresent
  requestTimeoutSeconds: 300
  maxRequestBytes: "67108864"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

terminationGracePeriodSeconds: 60

probes:
  startup:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 180
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

reranker:
  enabled: true
  replicaCount: 1
  model: nvidia/Nemotron-3.5-Rerank-8B-BF16
  servedModelName: nvidia/Nemotron-3.5-Rerank-8B-BF16
  revision: 39aa01525864f736e63f1d5742fc4cf59e754abd
  configSha256: e1f442a21c464cf54259e7ca2ab09f6777f50a61fbf017efed8e6044894b4303
  port: 8000
  maxModelLen: 32768
  # Use the checkpoint's vendored template unless explicitly overridden.
  chatTemplate: ""
  # The reranker needs a newer runtime than the independently pinned embedder.
  image:
    repository: vllm/vllm-openai
    tag: v0.32.0
    pullPolicy: IfNotPresent
  # Keep existing clients that send the previous model ID working.
  servedModelAliases:
    - nvidia/llama-nemotron-rerank-1b-v2
  rankingBackend: classify
  rankingConcurrency: 4
  extraArgs:
    - --dtype=bfloat16
    - --compilation-config={"compile_mm_encoder":true}
    - --max-num-seqs=4
    - --limit-mm-per-prompt={"image":1}
    - --pooler-config={"seq_pooling_type":"MEAN","use_activation":false}
    - --chat-template-content-format=openai
    # Keep the startup memory budget explicit across serving-runtime changes.
    - --gpu-memory-utilization=0.65
  extraEnv: []
  service:
    type: ClusterIP
    port: 8000
    # Used only for NodePort and LoadBalancer Services. Local preserves the
    # original client address by restricting external traffic to local pods.
    externalTrafficPolicy: Cluster
    # Optionally pin the internal Service IP for cluster-specific deployments.
    clusterIP: ""
    # Set when type is NodePort to reserve a specific port. Leave null to let
    # Kubernetes allocate one from the cluster's configured NodePort range.
    nodePort: null
    annotations: {}
    loadBalancerClass: ""
    allocateLoadBalancerNodePorts: true
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: 1000m
      memory: 16Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "4"
      memory: 32Gi
      nvidia.com/gpu: "1"
  persistence:
    enabled: true
    # Set true only when existingClaim/storageClass is verified to support
    # simultaneous mounts from replicas on distinct nodes.
    multiReplicaSafe: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # BF16 weights are 16.8 GB; retain room for the previous revision/rollback.
    size: 40Gi
    annotations: {}
    keep: false
  shm:
    sizeLimit: 2Gi
  strategy:
    type: Recreate
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  runtimeClassName: ""
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

embedder:
  enabled: true
  replicaCount: 1
  model: nvidia/Nemotron-3.5-Embed-1B-NVFP4
  servedModelName: nvidia/Nemotron-3.5-Embed-1B-NVFP4
  revision: 198164478bd2c4f2d3311d64eb563bc8564e0e6d
  configSha256: a83dbe0d763f1ace6c37496fd004e8d7d4f2d700bdf240d81313e9b85d81d37e
  port: 8000
  embeddingBackend: v2
  image:
    repository: vllm/vllm-openai
    tag: v0.32.0
    pullPolicy: IfNotPresent
  maxModelLen: 32768
  extraArgs:
    - --linear-backend=marlin
    - --dtype=bfloat16
    - --chat-template-content-format=openai
    - --max-num-seqs=16
    - --gpu-memory-utilization=0.45
    - --enforce-eager
  extraEnv: []
  service:
    type: ClusterIP
    port: 8000
    # Used only for NodePort and LoadBalancer Services. Local preserves the
    # original client address by restricting external traffic to local pods.
    externalTrafficPolicy: Cluster
    # Optionally pin the internal Service IP for cluster-specific deployments.
    clusterIP: ""
    # Set when type is NodePort to reserve a specific port. Leave null to let
    # Kubernetes allocate one from the cluster's configured NodePort range.
    nodePort: null
    annotations: {}
    loadBalancerClass: ""
    allocateLoadBalancerNodePorts: true
    loadBalancerSourceRanges: []
  resources:
    requests:
      cpu: 1000m
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: "1"
  persistence:
    # Independent emptyDir caches let replicas mount and roll on distinct GPU
    # nodes. Production rollout must pre-pull/warm the pinned model revision.
    enabled: false
    # Set true only when existingClaim/storageClass is verified to support
    # simultaneous mounts from replicas on distinct nodes.
    multiReplicaSafe: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
    keep: false
  shm:
    sizeLimit: 2Gi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  runtimeClassName: ""
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  enabled: true
  # Namespace access applies to both endpoints. Set this to [] when access
  # should come only from the component-specific CIDRs below.
  ingressNamespaces:
    - daedalus
    - nv-ingest
  # Each endpoint has an independent CIDR allowlist. Empty lists do not add
  # IP-based access; when all namespace and CIDR sources are empty, that
  # endpoint's policy denies all ingress.
  ingressCIDRs:
    reranker: []
    embedder: []
  # Allow host/remote-node traffic to the API port of NodePort/LoadBalancer
  # endpoints so Cilium permits forwarding across nodes after source NAT.
  # With plain NodePort, ingressCIDRs cannot restrict the original source of
  # forwarded traffic. LoadBalancer exposure additionally requires source ranges.
  ciliumNodePort:
    enabled: false

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.15.0
    pullPolicy: IfNotPresent
