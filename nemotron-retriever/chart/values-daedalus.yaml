# Reference-cluster values for the shared Daedalus namespace.
# Fixed LAN NodePorts and the Agent's internal Service names are stable contracts.
networkPolicy:
  ciliumNodePort:
    enabled: true
  ingressCIDRs:
    embedder:
      - 192.168.1.0/24
    reranker:
      - 192.168.1.0/24

embedder:
  # This vLLM profile needs discrete GPU memory; GB10 shares RAM with the host.
  nodeSelector:
    kubernetes.io/arch: amd64
  service:
    type: NodePort
    port: 8000
    externalTrafficPolicy: Cluster
    nodePort: 30085
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

reranker:
  service:
    type: NodePort
    port: 8000
    externalTrafficPolicy: Cluster
    nodePort: 30086
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
