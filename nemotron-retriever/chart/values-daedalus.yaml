# Reference-cluster values for the shared Daedalus namespace.
# Fixed LAN NodePorts and the Agent's internal Service names are stable contracts.
networkPolicy:
  ciliumNodePort:
    enabled: true
  ingressCIDRs:
    embedder:
      - 192.168.1.0/24
    reranker:
      - 192.168.1.0/24

embedder:
  # This vLLM profile needs discrete GPU memory; GB10 shares RAM with the host.
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: daedalus-02
  service:
    type: LoadBalancer
    loadBalancerClass: daedalus.ai/nodeport-only
    annotations:
      service.cilium.io/src-ranges-policy: allow
    # Filter the established LAN, VPN and cluster sources before NodePort SNAT.
    loadBalancerSourceRanges: &retrieverSourceRanges
      - 192.168.1.0/24
      - 172.30.50.0/24
      - 10.0.0.0/16
    port: 8000
    externalTrafficPolicy: Cluster
    nodePort: 30085
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

reranker:
  # This BF16 serving profile is validated on discrete L40S memory. A GPU count
  # alone does not distinguish smaller A30 devices or GB10 shared host memory.
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: daedalus-02
    nvidia.com/gpu.product: NVIDIA-L40S
  service:
    type: LoadBalancer
    loadBalancerClass: daedalus.ai/nodeport-only
    annotations:
      service.cilium.io/src-ranges-policy: allow
    loadBalancerSourceRanges: *retrieverSourceRanges
    port: 8000
    externalTrafficPolicy: Cluster
    nodePort: 30086
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
