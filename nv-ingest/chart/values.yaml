# nv-ingest contains values passed to the pinned upstream dependency.
nv-ingest:
  fullnameOverride: nv-ingest
  replicaCount: 2
  resources:
    requests:
      memory: 20Gi
      cpu: '3'
  image:
    repository: nvcr.io/nvidia/nemo-microservices/nv-ingest
    tag: 26.3.0
  service:
    type: ClusterIP
    port: 7670
  extraEnvVarsSecret: nv-ingest-object-store
  extraVolumes:
    local-pdfium:
      configMap:
        name: nv-ingest-local-parser
    local-nemotron:
      configMap:
        name: nv-ingest-local-parser
  # The upstream extraVolumeMounts template emits invalid indentation in 26.3.
  # The root post-renderer adds the two corresponding mounts.
  ngcImagePullSecret:
    create: false
    name: ngc-secret
  ngcApiSecret:
    create: false
  milvusDeployed: false
  envVars:
    LOCAL_DOCUMENT_PARSE_ENDPOINT: http://nv-ingest-parser:8000
    LOCAL_DOCUMENT_PARSE_REVISION: "0.1.0"
    # Upstream stage schemas require nonempty addresses for replaced engines.
    # These local-only, unimplemented paths fail closed if a legacy task uses them.
    OCR_HTTP_ENDPOINT: http://nv-ingest-parser:8000/legacy-disabled
    YOLOX_HTTP_ENDPOINT: http://nv-ingest-parser:8000/legacy-disabled
    YOLOX_GRAPHIC_ELEMENTS_HTTP_ENDPOINT: http://nv-ingest-parser:8000/legacy-disabled
    YOLOX_TABLE_STRUCTURE_HTTP_ENDPOINT: http://nv-ingest-parser:8000/legacy-disabled
    VLM_CAPTION_ENDPOINT: http://nv-ingest-parser:8000/legacy-disabled
    NEMOTRON_PARSE_HTTP_ENDPOINT: http://nv-ingest-parser:8000/legacy-disabled
    EMBEDDING_NIM_ENDPOINT: http://nemotron-retriever-embedder:8000/v1
    EMBEDDING_NIM_MODEL_NAME: nvidia/Nemotron-3.5-Embed-1B-NVFP4
    MILVUS_ENDPOINT: http://milvus:19530
    MINIO_INTERNAL_ADDRESS: http://milvus-minio:9000
    MINIO_PUBLIC_ADDRESS: http://milvus-minio:9000
    MINIO_BUCKET: nv-ingest
    IMAGE_STORAGE_URI: ""
    COMPONENTS_TO_READY_CHECK: ""
    MINIO_ACCESS_KEY: null
    MINIO_SECRET_KEY: null
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nv-ingest
              app.kubernetes.io/instance: nv-ingest
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [daedalus-06]
  redis:
    master:
      nodeSelector:
        kubernetes.io/hostname: daedalus-02
      persistence:
        storageClass: local-fast
        size: 50Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    replica:
      replicaCount: 1
      nodeSelector:
        kubernetes.io/hostname: daedalus-03
      persistence:
        storageClass: local-fast
        size: 50Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
  opentelemetry-collector:
    resources:
      requests:
        cpu: 50m
        memory: 320Mi
  zipkin:
    resources:
      requests:
        cpu: 50m
        memory: 2560Mi

# podDisruptionBudget configures the API availability budget missing upstream.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

localParser:
  image: daedalus.ddns.me:5050/btuttle/nemotron-parse:0.1.3
  service:
    type: NodePort
    nodePort: 30089
    externalTrafficPolicy: Cluster
  nodeSelector:
    kubernetes.io/hostname: daedalus-04
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 16Gi
      nvidia.com/gpu: "1"
