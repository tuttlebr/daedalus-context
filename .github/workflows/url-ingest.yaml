name: URL ingestion CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: url-ingest

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install requests PyYAML
      - run: python3 -m py_compile nv-ingest-ms-tasks.py tests/*.py
      - run: python3 -m unittest discover -s tests -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
      - run: helm lint chart --strict
      - run: helm template url-ingest chart --namespace daedalus > rendered-url-ingest.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: "-strict -ignore-missing-schemas url-ingest/rendered-url-ingest.yaml"
