name: Service charts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - k8s-multicluster-mcp
          - unifi-network-mcp
          - pdf-server
          - url-ingest
          - nv-ingest
          - nim-milvus-ms
          - nemotron-retriever
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.2
      - run: python3 -m pip install PyYAML
      - run: make -C "${{ matrix.service }}" validate-chart
