{{- if .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "unifi-mcp.fullname" . }}-netpol
  labels:
    {{- include "unifi-mcp.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "unifi-mcp.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities: [host, remote-node]
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules: {dns: [{matchPattern: "*"}]}
    - toEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules: {dns: [{matchPattern: "*"}]}
    - toCIDR: [{{ .Values.controller.cidr | quote }}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
{{- end }}
