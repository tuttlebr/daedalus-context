apiVersion: daedalus.context/v1
kind: Topology
partOf: daedalus-context
releases:
  hindsight:
    owner: ../daedalus-hindsight/charts/daedalus-hindsight
    tier: online
    namespace: daedalus
    requiredFor: [durable-memory]
    services:
      api:
        name: hindsight-api
        port: 8888
        protocol: http
        healthPath: /health
  milvus:
    owner: helm/milvus
    tier: online
    namespace: daedalus
    requiredFor: [domain-retrieval, existing-document-search]
    services:
      api:
        name: milvus
        port: 19530
        protocol: tcp
      objectStore:
        name: milvus-minio
        port: 9000
        protocol: http
        healthPath: /minio/health/ready
  retriever:
    owner: nemotron-retriever
    tier: online
    namespace: daedalus
    requiredFor: [domain-retrieval, existing-document-search]
    services:
      embeddings:
        name: nemotron-retriever-embedder
        port: 8000
        protocol: http
        healthPath: /adapter-health
      reranker:
        name: nemotron-retriever-reranker
        port: 8000
        protocol: http
        healthPath: /adapter-health
        optional: true
  nv-ingest:
    owner: helm/nv-ingest
    tier: ingestion
    namespace: daedalus
    requiredFor: [new-document-ingestion, collection-refresh]
    dependsOn: [milvus, retriever]
    services:
      api:
        name: nv-ingest
        port: 7670
        protocol: http
        healthPath: /v1/health/ready
  pdf-server:
    owner: helm/pdf-server
    tier: ingestion
    namespace: daedalus
    requiredFor: [collection-refresh]
    services:
      corpus:
        name: pdf-server
        port: 80
        protocol: http
        healthPath: /readyz
  url-ingest:
    owner: helm/url-ingest
    tier: ingestion
    namespace: daedalus
    requiredFor: [collection-refresh]
    dependsOn: [milvus, retriever, nv-ingest, pdf-server]
    services: {}
  k8s-mcp:
    owner: helm/k8s-mcp-server
    tier: tools
    namespace: daedalus
    requiredFor: []
    services:
      mcp:
        name: k8s-mcp-server
        port: 8080
        protocol: http
        livePath: /livez
        readyPath: /readyz
        dependencyPath: /dependencyz
        mcpPath: /mcp
  unifi-mcp:
    owner: helm/unifi-network-mcp-server
    tier: tools
    namespace: daedalus
    requiredFor: []
    services:
      mcp:
        name: unifi-network-mcp-server
        port: 8080
        protocol: http
        livePath: /livez
        readyPath: /readyz
        dependencyPath: /dependencyz
        mcpPath: /mcp
profiles:
  online-required: [hindsight, milvus, retriever]
  ingestion: [milvus, retriever, nv-ingest, pdf-server, url-ingest]
  tools: [k8s-mcp, unifi-mcp]
  all: [hindsight, milvus, retriever, nv-ingest, pdf-server, url-ingest, k8s-mcp, unifi-mcp]
failurePolicy:
  coreChatRequiresContext: false
  reranker: fail-open
  ingestionFailureAffectsExistingSearch: false
  optionalToolFailureAffectsCoreChat: false
