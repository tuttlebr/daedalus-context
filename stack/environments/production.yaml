apiVersion: daedalus.context/v1
kind: Environment
name: production
profile: all
production: true
ragReadinessMode: degraded
requiredCollections: [nvidia, kubernetes, vetpartner, semianalysis, mentalhealth]
namespaceMode: independent
storage:
  etcdStorageClass: local-etcd
  minioStorageClass: nfs-client
  documentArtifactStore: shared-internal-minio
acceptance:
  status: approved
  operatingMode: personal-single-user
  haRequired: false
  haPhaseBlocked: false
  acceptedRisks:
    - MinIO and stateful PVCs depend on one NFS appliance and can be interrupted by its failure.
    - Redis recovery is restart-based and does not provide automatic failover.
    - No numeric node-loss, RPO, or RTO objectives apply to this personal deployment.
    - Document artifacts share internal MinIO credentials; the application downloads objects before submitting bytes to NV-Ingest.
