apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pdf-server.fullname" . }}-nginx-conf
  labels:
    {{- include "pdf-server.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        location = /livez { access_log off; default_type application/json; return 200 '{"status":"live"}'; }
        location = /readyz { access_log off; default_type application/json; return 200 '{"status":"ready"}'; }
        location /pdfs/ {
            alias /usr/share/nginx/pdfs/;
            autoindex on;
            types { application/pdf pdf; }
            add_header Content-Disposition "inline";
            client_max_body_size 100M;
        }
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }
