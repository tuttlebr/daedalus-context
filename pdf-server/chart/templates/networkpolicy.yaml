{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pdf-server.fullname" . }}
  labels:
    {{- include "pdf-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pdf-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range .Values.networkPolicy.ingressPodSelectors }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
    {{- end }}
  egress: []
{{- end }}
