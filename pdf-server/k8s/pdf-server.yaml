apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdf-server
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdf-server-data
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: __STORAGE_SIZE__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdf-server-nginx-conf
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location = /livez {
            access_log off;
            default_type application/json;
            return 200 '{"status":"live"}';
        }

        location = /readyz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ready"}';
        }

        location /pdfs/ {
            alias /usr/share/nginx/pdfs/;
            autoindex on;
            types { application/pdf pdf; }
            add_header Content-Disposition "inline";
            client_max_body_size 100M;
        }

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-server
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdf-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdf-server
        app.kubernetes.io/instance: pdf-server
        app.kubernetes.io/component: corpus-server
        app.kubernetes.io/part-of: daedalus-context
        app.kubernetes.io/version: "1.27.4"
        app.kubernetes.io/managed-by: contextctl
        daedalus.ai/tier: ingestion
        daedalus.ai/capability: pdf-corpus
      annotations:
        daedalus.ai/config-checksum: "__CONFIG_CHECKSUM__"
    spec:
      serviceAccountName: pdf-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pdf-server
              app.kubernetes.io/instance: pdf-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: __PDF_SERVER_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            timeoutSeconds: 2
            periodSeconds: 20
          volumeMounts:
            - name: pdf-data
              mountPath: /usr/share/nginx/pdfs
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: pdf-data
          persistentVolumeClaim:
            claimName: pdf-server-data
        - name: nginx-conf
          configMap:
            name: pdf-server-nginx-conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-server
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdf-server
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdf-server
      app.kubernetes.io/instance: pdf-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdf-server
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pdf-server
    app.kubernetes.io/instance: pdf-server
    app.kubernetes.io/component: corpus-server
    app.kubernetes.io/part-of: daedalus-context
    app.kubernetes.io/version: "1.27.4"
    app.kubernetes.io/managed-by: contextctl
    daedalus.ai/tier: ingestion
    daedalus.ai/capability: pdf-corpus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pdf-server
      app.kubernetes.io/instance: pdf-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __NAMESPACE__
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __AGENT_NAMESPACE__
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __URL_INGEST_NAMESPACE__
      ports:
        - protocol: TCP
          port: 8080
  egress: []
