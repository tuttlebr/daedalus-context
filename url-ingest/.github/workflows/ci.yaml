name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile nv-ingest-ms-tasks.py k8s/render-manual-job.py tests/*.py
      - run: python3 -m unittest discover -s tests -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: "-strict -ignore-missing-schemas k8s"
      - run: bash -n k8s/deploy.sh k8s/lib/job-control.sh
