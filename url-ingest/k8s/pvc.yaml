apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: url-ingest-data
  namespace: milvus
  labels:
    app.kubernetes.io/name: url-ingest
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: url-ingest-manifests
  namespace: milvus
  labels:
    app.kubernetes.io/name: url-ingest
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
